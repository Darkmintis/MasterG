<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MasterG Report</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem("masterg-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<style>
/* Graded paper - strict teacher + tech. Tokens in variables; AA-checked pairs. */
:root,
html[data-theme="light"] {
  color-scheme: light;

  --bg: #F6F0E6;
  --surface: #FFFBF4;
  --line: #E3D8C8;
  --ink: #2B1D14;
  --muted: #7A6656;
  --accent: #C2603A;
  --accent-text: #9C4626;
  --accent-ink: #FFFBF4;
  --chip: #F0E6D6;
  --focus: #9C4626;
  --warn-bg: #F3E4D0;

  --score-latte: #EBD9C3;
  --score-mocha: #B07A52;
  --score-espresso: #4A2E1D;
  --score-track: #E3D8C8;
  --score-mocha-text: #8B5230;

  --sev-critical: #B3261E;
  --sev-critical-bg: #F8E8E6;
  --sev-major: #8A5A12;
  --sev-major-bg: #F5EBD8;
  --sev-minor: #5E5348;
  --sev-minor-bg: #EFE8DE;

  --shadow: 0 1px 0 rgba(43, 29, 20, 0.06);
  --scroll-thumb: #C2603A;
  --scroll-track: #E3D8C8;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: Georgia, "Times New Roman", Times, serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

html[data-theme="dark"] {
  color-scheme: dark;

  --bg: #1A120D;
  --surface: #241A13;
  --line: #3A2B20;
  --ink: #F0E6D8;
  --muted: #A8927E;
  --accent: #E08A5F;
  --accent-text: #E08A5F;
  --accent-ink: #1A120D;
  --chip: #2F231A;
  --focus: #E08A5F;
  --warn-bg: #3A2B20;

  --score-latte: #5C4030;
  --score-mocha: #B07A52;
  --score-espresso: #EBD9C3;
  --score-track: #3A2B20;
  --score-mocha-text: #E0A87A;

  --sev-critical: #F07167;
  --sev-critical-bg: #3A1E1C;
  --sev-major: #E0B35A;
  --sev-major-bg: #3A2E18;
  --sev-minor: #A8927E;
  --sev-minor-bg: #2F231A;

  --shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
  --scroll-thumb: #E08A5F;
  --scroll-track: #3A2B20;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

/* Custom scrollbars (vertical + horizontal) */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll-thumb) var(--scroll-track);
}
*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
*::-webkit-scrollbar-track {
  background: var(--scroll-track);
  border-radius: 999px;
}
*::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--scroll-thumb) 75%, var(--scroll-track));
  border-radius: 999px;
  border: 2px solid var(--scroll-track);
}
*::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-thumb);
}
*::-webkit-scrollbar-corner {
  background: var(--scroll-track);
}

body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  line-height: 1.5;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, var(--bg)) 0%, var(--bg) 220px),
    var(--bg);
  transition: background 0.25s ease, color 0.25s ease;
}
a { color: var(--accent-text); }
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--accent-text);
  color: var(--accent-ink);
  padding: 8px 12px;
  z-index: 100;
  border-radius: 0 0 6px 0;
  font-weight: 700;
}
.skip-link:focus { left: 0; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: 10px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.topbar .brand {
  margin: 0;
  font-size: 0.7rem;
}

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 22px 88px;
}

/* Subtle paper grain (no network) */
body::before {
  content: "";
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.wrap, .topbar { position: relative; z-index: 1; }

/* Header */
header.hero { margin-bottom: 28px; }
.toprow {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.brand {
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
h1 {
  margin: 6px 0 0;
  font-size: clamp(1.85rem, 3.4vw, 2.5rem);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.12;
}
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: flex-end;
}
@media (max-width: 640px) {
  .wrap { padding: 20px 14px 72px; }
  .topbar-inner { padding: 8px 14px; }
  .toprow { gap: 10px; }
  .header-actions { width: 100%; justify-content: flex-start; }
  .meta { justify-content: flex-start; }
  .scoreboard { gap: 18px; padding: 18px 14px; }
  .ring { width: 128px; height: 128px; }
  .ring-inner .num { font-size: 2rem; }
  .tile { min-height: 0; }
  .grid { grid-template-columns: 1fr; gap: 10px; }
}
.chip {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 4px;
  background: var(--chip);
  color: var(--ink);
  font-size: 0.78rem;
  font-weight: 600;
  border: 1px solid transparent;
}
.chip.muted {
  background: transparent;
  border-color: var(--line);
  color: var(--muted);
  font-weight: 500;
}
button.chip { font: inherit; cursor: pointer; }

.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.theme-toggle button {
  font: inherit;
  cursor: pointer;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 6px 11px;
  border-radius: 999px;
  transition: background 0.18s ease, color 0.18s ease;
}
.theme-toggle button[aria-pressed="true"] {
  background: var(--accent-text);
  color: var(--accent-ink);
}
.theme-toggle button:hover:not([aria-pressed="true"]) {
  color: var(--ink);
  background: var(--chip);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.btn-export {
  font: inherit;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--accent-text);
  color: var(--accent-ink);
  border-radius: 6px;
  padding: 7px 14px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  box-shadow: var(--shadow);
  transition: transform 0.18s ease, filter 0.18s ease;
}
.btn-export:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn-export:active { transform: translateY(0); }

/* Charts */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.chart-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.chart-card h3 {
  margin: 0 0 12px;
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.chart-card .chart-empty {
  color: var(--muted);
  font-size: 0.9rem;
  margin: 0;
}
.chart-svg {
  width: 100%;
  height: auto;
  display: block;
}
.chart-svg .grid-line { stroke: var(--line); stroke-width: 1; }
.chart-svg .axis-label {
  fill: var(--muted);
  font-size: 10px;
  font-family: var(--font);
}
.chart-svg .series {
  fill: none;
  stroke: var(--accent-text);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  transition: stroke-dashoffset 0.9s ease;
}
.chart-svg .series.is-drawn { stroke-dashoffset: 0; }
.chart-svg .series-area {
  fill: color-mix(in srgb, var(--accent) 18%, transparent);
  stroke: none;
  opacity: 0;
  transition: opacity 0.6s ease 0.2s;
}
.chart-svg .series-area.is-drawn { opacity: 1; }
.chart-svg .dot {
  fill: var(--surface);
  stroke: var(--accent-text);
  stroke-width: 2;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.chart-svg .dot.is-drawn { opacity: 1; }
.chart-svg .donut-arc {
  transition: stroke-dasharray 0.85s cubic-bezier(0.22, 1, 0.36, 1);
}
.chart-svg .bar {
  fill: var(--score-mocha);
}
.chart-svg .bar.high { fill: var(--score-espresso); }
.chart-svg .bar.mid { fill: var(--score-mocha); }
.chart-svg .bar.low { fill: var(--score-latte); }
.chart-svg .bar-label {
  fill: var(--ink);
  font-size: 11px;
  font-family: var(--font);
}
.chart-svg .bar-score {
  fill: var(--ink);
  font-size: 12px;
  font-family: var(--serif);
  font-weight: 700;
}
.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  margin-top: 10px;
  font-size: 0.78rem;
  color: var(--muted);
}
.chart-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chart-legend i {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}
.hbar-row {
  display: grid;
  grid-template-columns: minmax(90px, 140px) 1fr auto;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
}
.hbar-row .name {
  font-size: 0.8rem;
  color: var(--ink);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hbar-track {
  height: 10px;
  background: var(--score-track);
  border-radius: 999px;
  overflow: hidden;
}
.hbar-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--score-mocha);
  width: 0;
  transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-reduced-motion: reduce) {
  .hbar-fill, .chart-svg .series, .chart-svg .series-area, .chart-svg .dot, .chart-svg .donut-arc {
    transition: none;
  }
}
.hbar-fill.high { background: var(--score-espresso); }
.hbar-fill.mid { background: var(--score-mocha); }
.hbar-fill.low { background: var(--score-latte); }
.hbar-score {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 0.95rem;
  min-width: 2.4rem;
  text-align: right;
}
.spark-row {
  display: grid;
  grid-template-columns: minmax(90px, 140px) 1fr auto;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.8rem;
}
.spark-row svg { width: 100%; height: 28px; display: block; }

.scoreboard {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 28px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px 28px;
  box-shadow: var(--shadow);
  animation: paper-in 0.55s ease both;
}
@keyframes paper-in {
  /* Transform only - never fade from 0 (breaks first paint / screenshots) */
  from { transform: translateY(8px); }
  to { transform: translateY(0); }
}
@media (max-width: 720px) {
  .scoreboard {
    grid-template-columns: 1fr;
    justify-items: center;
    text-align: center;
    padding: 22px 18px;
  }
}

.ring {
  --p: 0;
  --ring-fill: var(--accent);
  width: 152px;
  height: 152px;
  border-radius: 50%;
  background: conic-gradient(var(--ring-fill) calc(var(--p) * 1%), var(--score-track) 0);
  display: grid;
  place-items: center;
  position: relative;
  transition: filter 0.35s ease;
  animation: ring-in 0.7s ease both;
}
@keyframes ring-in {
  from { transform: scale(0.96); }
  to { transform: scale(1); }
}
.ring::before {
  content: "";
  position: absolute;
  inset: 11px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line);
}
.ring-inner {
  position: relative;
  z-index: 1;
  text-align: center;
}
.ring-inner .num {
  font-family: var(--serif);
  font-size: 2.45rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  color: var(--ink);
}
.ring-inner .band {
  margin-top: 6px;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}

.verdict {
  font-family: var(--serif);
  font-size: clamp(1.2rem, 2.5vw, 1.65rem);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.01em;
  margin: 0 0 12px;
  color: var(--ink);
}
.submeta { color: var(--muted); font-size: 0.92rem; }
.submeta strong { color: var(--ink); font-weight: 700; }

.delta {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.delta.up::before { content: "▲ "; color: var(--accent-text); }
.delta.down::before { content: "▼ "; color: var(--sev-critical); }
.delta.flat::before { content: "· "; color: var(--muted); }

/* Sections */
section { margin-top: 36px; }
section h2 {
  margin: 0 0 14px;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
  /* Prevent one open Details drawer from stretching sibling cards in the row */
  align-items: start;
}

.tile {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 156px;
  overflow: hidden;
  width: 100%;
  transition:
    transform 0.22s ease,
    box-shadow 0.22s ease,
    border-color 0.22s ease;
  animation: paper-in 0.45s ease both;
  animation-delay: calc(var(--i, 0) * 35ms);
}
.tile:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(43, 29, 20, 0.08);
  border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
}
@media (prefers-reduced-motion: reduce) {
  .tile:hover { transform: none; }
}
.tile::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--score-bar, var(--line));
}
.tile.unverified {
  opacity: 0.78;
  background: color-mix(in srgb, var(--surface) 70%, var(--line));
}
.tile.unverified::before { background: var(--line); }

.tile-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.tile-name {
  font-weight: 700;
  font-size: 0.95rem;
  line-height: 1.3;
  padding-left: 6px;
}
.tile-score {
  font-family: var(--serif);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 1.35rem;
  line-height: 1;
  color: var(--score-ink, var(--ink));
  white-space: nowrap;
}
.tile-summary {
  color: var(--muted);
  font-size: 0.9rem;
  flex: 1;
  padding-left: 6px;
  line-height: 1.45;
}
.tile-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding-left: 6px;
}

button.details, button.tab, button.filter, select { font: inherit; cursor: pointer; }
button.details {
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 6px;
  padding: 6px 11px;
  font-size: 0.78rem;
  font-weight: 650;
  transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
}
button.details:hover { border-color: var(--accent); color: var(--accent-text); }
button.details[aria-expanded="true"] {
  background: var(--chip);
  border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
  color: var(--accent-text);
}

.drawer {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  margin-top: 0;
  margin-left: 6px;
  font-size: 0.9rem;
  transition:
    grid-template-rows 0.3s ease,
    opacity 0.22s ease,
    margin-top 0.22s ease;
}
.drawer.open {
  grid-template-rows: 1fr;
  opacity: 1;
  margin-top: 4px;
}
.drawer-inner {
  overflow: hidden;
  min-height: 0;
  border-top: 1px dashed transparent;
  padding-top: 0;
  transition: border-color 0.22s ease, padding-top 0.22s ease;
}
.drawer.open .drawer-inner {
  border-top-color: var(--line);
  padding-top: 12px;
}
.drawer h3 {
  margin: 14px 0 6px;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}
.drawer h3:first-child { margin-top: 0; }
.drawer p { margin: 0 0 8px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) {
  .drawer, .drawer-inner, button.details, .tile, .card, button.tab, .ring, .scoreboard, .panel {
    transition: none;
    animation: none;
  }
  .tile:hover, .card:hover { transform: none; }
}
html[data-theme="dark"] .tile:hover,
html[data-theme="dark"] .card:hover {
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}
.ev {
  margin: 0;
  padding-left: 1.1rem;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.76rem;
  line-height: 1.45;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.card:hover {
  transform: translateY(-1px);
  border-color: color-mix(in srgb, var(--accent) 22%, var(--line));
  box-shadow: 0 6px 18px rgba(43, 29, 20, 0.07);
}
.card h3 {
  margin: 10px 0 8px;
  font-size: 1.02rem;
  line-height: 1.3;
}

/* Red pen severity - always labeled text */
.sev {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid transparent;
}
.sev.critical {
  color: var(--sev-critical);
  background: var(--sev-critical-bg);
  border-color: color-mix(in srgb, var(--sev-critical) 25%, transparent);
}
.sev.major {
  color: var(--sev-major);
  background: var(--sev-major-bg);
  border-color: color-mix(in srgb, var(--sev-major) 25%, transparent);
}
.sev.minor, .sev.nit {
  color: var(--sev-minor);

    if (!lightBtn || !darkBtn) return;
    lightBtn.setAttribute("aria-pressed", theme === "light" ? "true" : "false");
    darkBtn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
  }
  function setTheme(theme) {
    const next = theme === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("masterg-theme", next); } catch (e) {}
    syncThemeButtons();
  }
  document.getElementById("theme-light").addEventListener("click", () => setTheme("light"));
  document.getElementById("theme-dark").addEventListener("click", () => setTheme("dark"));
  syncThemeButtons();

  const raw = document.getElementById("masterg-data").textContent;
  let payload;
  try { payload = JSON.parse(raw); } catch (e) { payload = { versions: [], history: [] }; }

  const versions = payload.versions || [];
  const history = payload.history || versions.map(v => ({
    version: v.version, date: (v.created_at || "").slice(0, 10),
    overall: v.overall, evidence_coverage: v.evidence_coverage, verdict_band: v.verdict_band
  }));

  let current = versions.find(v => v.version === payload.latest_version) || versions[versions.length - 1];

  /** Latte → mocha → espresso. Number always printed; bar uses ramp. Dark flips via CSS vars. */
  function scoreTokens(score) {
    if (score == null) {
      return { bar: "var(--line)", ink: "var(--muted)", fill: "var(--score-track)" };
    }
    if (score <= 3) {
      return { bar: "var(--score-latte)", ink: "var(--muted)", fill: "var(--score-latte)" };
    }
    if (score <= 6) {
      return {
        bar: "var(--score-mocha)",
        ink: "var(--score-mocha-text)",
        fill: "var(--score-mocha)"
      };
    }
    return {
      bar: "var(--score-espresso)",
      ink: "var(--score-espresso)",
      fill: "var(--score-espresso)"
    };
  }

  function overallFill(overall) {
    if (overall == null) return "var(--score-track)";
    if (overall < 35) return "var(--score-latte)";
    if (overall < 50) return "var(--score-mocha)";
    if (overall < 65) return "var(--score-mocha)";
    return "var(--score-espresso)";
  }

  function deltaHtml(d) {
    if (d == null || d === 0) return '<span class="delta flat">0</span>';
    const cls = d > 0 ? "up" : "down";
    const sign = d > 0 ? "+" : "";
    return `<span class="delta ${cls}">${sign}${d}</span>`;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function evidenceList(ev) {
    if (!ev || !ev.length) return "<p class='submeta'>No evidence cited.</p>";
    return "<ul class='ev'>" + ev.map(e =>
      `<li><strong>${esc(e.ref)}</strong> - ${esc(e.quote)}</li>`
    ).join("") + "</ul>";
  }

  function sevLabel(sev) {
    const map = { critical: "Critical", major: "Major", minor: "Minor", nit: "Nit" };
    return map[sev] || sev;
  }

  function renderHeader() {
    document.getElementById("product-name").textContent = current.product.name;
    document.title = `MasterG - ${current.product.name} v${current.version}`;
    document.getElementById("meta-chips").innerHTML = `
      <span class="chip">v${esc(current.version)}</span>
      <span class="chip muted">${esc((current.created_at || "").slice(0, 10))}</span>
      <span class="chip muted">${esc(current.product.type)}</span>
      <span class="chip muted">${esc(current.product.stage)}</span>`;

    const overall = current.overall;
    const ring = document.getElementById("score-ring");
    const num = document.getElementById("overall-num");
    const band = document.getElementById("overall-band");
    if (overall == null) {
      ring.style.setProperty("--p", 0);
      ring.style.setProperty("--ring-fill", "var(--score-track)");
      num.textContent = "-";
      band.textContent = "Insufficient evidence";
    } else {
      ring.style.setProperty("--p", overall);
      ring.style.setProperty("--ring-fill", overallFill(overall));
      num.textContent = String(overall);
      band.textContent = current.verdict_band_label || "";
    }
    document.getElementById("verdict-line").textContent = current.verdict_line || "";
    const cov = Math.round((current.evidence_coverage || 0) * 100);
    document.getElementById("submeta").innerHTML =
      `Evidence coverage <strong>${cov}%</strong>` +
      (current.overall_delta != null ? ` · ${deltaHtml(current.overall_delta)} vs previous` : "") +
      (overall == null
        ? ` <div class="insufficient" style="margin-top:10px">Insufficient evidence for an overall score. Add screenshots, exports, or broader code coverage.</div>`
        : "");
  }

  function renderCategories() {
    const grid = document.getElementById("category-grid");
    grid.innerHTML = "";
    (current.scores || []).forEach((s, idx) => {
      const unverified = !s.applicable || s.score == null || s.confidence === "unverified";
      const tok = scoreTokens(unverified ? null : s.score);
      const tile = document.createElement("article");
      tile.className = "tile" + (unverified ? " unverified" : "");
      tile.style.setProperty("--i", String(idx));
      tile.style.setProperty("--score-bar", tok.bar);
      tile.style.setProperty("--score-ink", tok.ink);
      const scoreLabel = !s.applicable ? "n/a" : (s.score == null ? "-" : `${s.score}/10`);
      tile.innerHTML = `
        <div class="tile-top">
          <div class="tile-name">${esc(s.name)}</div>
          <div class="tile-score">${esc(scoreLabel)}</div>
        </div>
        <div class="tile-summary">${esc(unverified ? (s.applicable === false ? "Not applicable for this product type." : "Unverified - needs evidence.") : s.summary)}</div>
        <div class="tile-actions">
          <span class="submeta">${s.delta != null ? deltaHtml(s.delta) : ""}${s.confidence && s.applicable ? ` · ${esc(s.confidence)}` : ""}</span>
          <button class="details" type="button" aria-expanded="false" data-idx="${idx}">Details</button>
        </div>
        <div class="drawer" id="drawer-${idx}"><div class="drawer-inner"></div></div>`;
      grid.appendChild(tile);
      const btn = tile.querySelector("button.details");
      const drawer = tile.querySelector(".drawer");
      const inner = tile.querySelector(".drawer-inner");
      const cat = (current.categories || []).find(c => c.id === s.id) || s;
      const findings = (current.findings || []).filter(f => f.category === s.id);
      inner.innerHTML = `
        <h3>Why this score</h3><p>${esc(cat.why || s.why || "-")}</p>
        <h3>Why not higher</h3><p>${esc(cat.why_not_higher || s.why_not_higher || "-")}</p>
        <h3>Evidence</h3>${evidenceList(cat.evidence || s.evidence)}
        <h3>Findings in this category</h3>
        ${findings.length ? findings.map(f => findingCard(f)).join("") : "<p class='submeta'>None.</p>"}`;
      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", open ? "false" : "true");
        drawer.classList.toggle("open", !open);
      });
    });
  }

  function findingCard(f) {
    return `<article class="card" data-severity="${esc(f.severity)}" data-status="${esc(f.status || "new")}">
      <div class="tile-top">
        <span class="sev ${esc(f.severity)}">${esc(sevLabel(f.severity))}</span>
        <span class="chip muted">${esc(f.status || "new")} · ${esc(f.effort)}/${esc(f.impact)}</span>
      </div>
      <h3>${esc(f.title)}</h3>
      <p><strong>Why:</strong> ${esc(f.why)}</p>
      <p><strong>Counterpoint:</strong> ${esc(f.counterpoint)}</p>
      <p><strong>Fix:</strong> ${esc(f.fix)}</p>
      ${evidenceList(f.evidence)}
      <p class="submeta">${esc(f.key)}</p>
    </article>`;
  }

  function renderFixFirst() {
    const el = document.getElementById("fix-first");
    const items = current.fix_first || [];
    if (!items.length) { el.innerHTML = "<p class='submeta'>No open findings ranked.</p>"; return; }
    el.innerHTML = items.map(f => {
      const full = (current.findings || []).find(x => x.key === f.key) || f;
      return `<article class="card">
        <div class="tile-top">
          <span class="sev ${esc(f.severity)}">${esc(sevLabel(f.severity))}</span>
          <span class="chip muted">effort ${esc(f.effort)} · impact ${esc(f.impact)}</span>
        </div>
        <h3>${esc(f.title)}</h3>
        <p class="submeta">${esc(f.category)}</p>
        ${full.fix ? `<p><strong>Fix:</strong> ${esc(full.fix)}</p>` : ""}
      </article>`;
    }).join("");
  }

  function renderStrengths() {
    const el = document.getElementById("strengths");
    const items = current.strengths || [];
    el.innerHTML = items.length
      ? items.map(s => `<div class="strength">${esc(s.title)}</div>`).join("")
      : "<p class='submeta'>No evidenced strengths recorded.</p>";
  }

  function renderFindings() {
    document.getElementById("findings-list").innerHTML =
      (current.findings || []).map(findingCard).join("") || "<p class='submeta'>No findings.</p>";
    applyFilters();
  }

  function applyFilters() {
    const sev = document.getElementById("filter-severity").dataset.value || "all";
    const st = document.getElementById("filter-status").dataset.value || "open";
    let visible = 0;
    document.querySelectorAll("#findings-list .card").forEach(card => {
      const okSev = sev === "all" || card.dataset.severity === sev;
      const status = card.dataset.status;
      let okSt = true;
      if (st === "open") okSt = ["new", "persisting", "regressed"].includes(status);
      else if (st !== "all") okSt = status === st;
      const show = okSev && okSt;
      card.style.display = show ? "" : "none";
      if (show) visible += 1;
    });
    let empty = document.getElementById("findings-empty");
    if (!empty) {
      empty = document.createElement("p");
      empty.id = "findings-empty";
      empty.className = "submeta";
      document.getElementById("findings-list").appendChild(empty);
    }
    empty.textContent = visible ? "" : "No findings match these filters.";
    empty.style.display = visible ? "none" : "block";
  }

  function closeAllDropdowns(except) {
    document.querySelectorAll(".dd.open").forEach(dd => {
      if (except && dd === except) return;
      dd.classList.remove("open");
      const trigger = dd.querySelector(".dd-trigger");
      const menu = dd.querySelector(".dd-menu");
      if (trigger) trigger.setAttribute("aria-expanded", "false");
      if (menu) menu.hidden = true;
    });
  }

  function initDropdowns() {
    document.querySelectorAll(".filters .dd").forEach(dd => {
      const trigger = dd.querySelector(".dd-trigger");
      const menu = dd.querySelector(".dd-menu");
      const label = dd.querySelector(".dd-label");
      if (!trigger || !menu || !label) return;
      const options = () => Array.from(menu.querySelectorAll(".dd-option"));

      function openMenu() {
        closeAllDropdowns();
        dd.classList.add("open");
        trigger.setAttribute("aria-expanded", "true");
        menu.hidden = false;
        const selected = options().find(o => o.getAttribute("aria-selected") === "true") || options()[0];
        if (selected) selected.focus();
      }
      function choose(opt) {
        dd.dataset.value = opt.getAttribute("data-value");
        label.textContent = opt.textContent.trim();
        options().forEach(o => o.setAttribute("aria-selected", o === opt ? "true" : "false"));
        closeAllDropdowns();
        trigger.focus();
        applyFilters();
      }

      trigger.addEventListener("click", (e) => {
        e.stopPropagation();
        if (dd.classList.contains("open")) closeAllDropdowns();
        else openMenu();
      });
      trigger.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openMenu();
        }
      });
      options().forEach((opt, idx) => {
        opt.addEventListener("click", (e) => {
          e.stopPropagation();
          choose(opt);
        });
        opt.addEventListener("keydown", (e) => {
          const list = options();
          if (e.key === "ArrowDown") {
            e.preventDefault();
            list[Math.min(idx + 1, list.length - 1)].focus();
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            list[Math.max(idx - 1, 0)].focus();
          } else if (e.key === "Home") {
            e.preventDefault();
            list[0].focus();
          } else if (e.key === "End") {
            e.preventDefault();
            list[list.length - 1].focus();
          } else if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            choose(opt);
          } else if (e.key === "Escape") {
            e.preventDefault();
            closeAllDropdowns();
            trigger.focus();
          }
        });
      });
    });

    document.addEventListener("click", () => closeAllDropdowns());
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAllDropdowns();
    });
  }

  function scoreBandClass(score) {
    if (score == null) return "low";
    if (score <= 3) return "low";
    if (score <= 6) return "mid";
    return "high";
  }

  function openFindings() {
    return (current.findings || []).filter(f =>
      ["new", "persisting", "regressed"].includes(f.status || "new")
    );
  }

  function renderCategoryBars(targetId) {
    const el = document.getElementById(targetId);
    if (!el) return;
    const scores = (current.scores || []).filter(s => s.applicable !== false);
    if (!scores.length) {
      el.innerHTML = "<p class='chart-empty'>No category scores.</p>";
      return;
    }
    el.innerHTML = scores.map(s => {
      const score = s.score;
      const pct = score == null ? 0 : score * 10;
      const label = score == null ? "-" : `${score}/10`;
      return `<div class="hbar-row" title="${esc(s.name)}">
        <div class="name">${esc(s.name)}</div>
        <div class="hbar-track"><div class="hbar-fill ${scoreBandClass(score)}" data-width="${pct}"></div></div>
        <div class="hbar-score">${esc(label)}</div>
      </div>`;
    }).join("");
  }

  function renderFindingsDonut(targetId) {
    const el = document.getElementById(targetId);
    if (!el) return;
    const open = openFindings();
    const counts = { critical: 0, major: 0, minor: 0, nit: 0 };
    open.forEach(f => { if (counts[f.severity] != null) counts[f.severity] += 1; });
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    if (!total) {
      el.innerHTML = "<p class='chart-empty'>No open findings.</p>";
      return;
    }
    const colors = {
      critical: "var(--sev-critical)",
      major: "var(--sev-major)",
      minor: "var(--sev-minor)",
      nit: "var(--muted)"
    };
    const r = 54, cx = 70, cy = 70, stroke = 16;
    const C = 2 * Math.PI * r;
    let offset = 0;
    const arcs = ["critical", "major", "minor", "nit"].map(k => {
      const n = counts[k];
      if (!n) return "";
      const len = (n / total) * C;
      const circle = `<circle class="donut-arc" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[k]}" stroke-width="${stroke}"
        stroke-dasharray="0 ${C}" data-len="${len}" data-gap="${C - len}" stroke-dashoffset="${-offset}"
        transform="rotate(-90 ${cx} ${cy})"></circle>`;
      offset += len;
      return circle;
    }).join("");
    el.innerHTML = `
      <svg class="chart-svg" viewBox="0 0 200 140" role="img" aria-label="Open findings by severity">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--score-track)" stroke-width="${stroke}"></circle>
        ${arcs}
        <text x="${cx}" y="${cy - 2}" text-anchor="middle" class="bar-score" style="font-size:18px">${total}</text>
        <text x="${cx}" y="${cy + 14}" text-anchor="middle" class="axis-label">open</text>
      </svg>
      <div class="chart-legend">
        ${["critical", "major", "minor", "nit"].map(k =>
          counts[k] ? `<span><i style="background:${colors[k]}"></i>${k} ${counts[k]}</span>` : ""
        ).join("")}
      </div>`;
  }

  function renderOverallLine() {
    const el = document.getElementById("chart-overall-line");
    if (!el) return;
    const hist = history.slice().sort((a, b) => a.version - b.version);
    const points = hist.filter(h => h.overall != null);
    if (points.length < 1) {
      el.innerHTML = "<p class='chart-empty'>No overall scores yet.</p>";
      return;
    }
    const w = 640, h = 200, pad = { t: 20, r: 20, b: 36, l: 40 };
    const innerW = w - pad.l - pad.r;
    const innerH = h - pad.t - pad.b;
    const xs = points.map((_, i) => pad.l + (points.length === 1 ? innerW / 2 : (i / (points.length - 1)) * innerW));
    const ys = points.map(p => pad.t + innerH - (p.overall / 100) * innerH);
    const line = points.map((p, i) => `${i ? "L" : "M"}${xs[i]},${ys[i]}`).join(" ");
    const area = `${line} L${xs[xs.length - 1]},${pad.t + innerH} L${xs[0]},${pad.t + innerH} Z`;
    const grid = [0, 25, 50, 75, 100].map(v => {
      const y = pad.t + innerH - (v / 100) * innerH;
      return `<line class="grid-line" x1="${pad.l}" x2="${w - pad.r}" y1="${y}" y2="${y}"></line>
        <text class="axis-label" x="${pad.l - 8}" y="${y + 3}" text-anchor="end">${v}</text>`;
    }).join("");
    const dots = points.map((p, i) =>
      `<circle class="dot" cx="${xs[i]}" cy="${ys[i]}" r="4">
        <title>v${p.version}: ${p.overall}</title>
      </circle>
      <text class="axis-label" x="${xs[i]}" y="${h - 12}" text-anchor="middle">v${p.version}</text>`
    ).join("");
    el.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Overall score trend">
      ${grid}
      <path class="series-area" d="${area}"></path>
      <path class="series" d="${line}"></path>
      ${dots}
    </svg>`;
  }

  function renderCategorySparks() {
    const el = document.getElementById("chart-category-sparks");
    if (!el) return;
    if (versions.length < 2) {
      el.innerHTML = "<p class='chart-empty'>Need v2+ for category sparklines.</p>";
      return;
    }
    const ids = (current.scores || []).filter(s => s.applicable !== false).map(s => s.id);
    el.innerHTML = ids.map(id => {
      const name = (current.scores.find(s => s.id === id) || {}).name || id;
      const series = versions.map(v => {
        const s = (v.scores || []).find(x => x.id === id);
        return s && s.score != null ? s.score : null;
      });
      const valid = series.map((v, i) => v == null ? null : { i, v }).filter(Boolean);
      if (valid.length < 1) return "";
      const w = 160, h = 28, pad = 3;
      const pts = valid.map(p => {
        const x = pad + (p.i / Math.max(versions.length - 1, 1)) * (w - pad * 2);
        const y = pad + (1 - p.v / 10) * (h - pad * 2);
        return `${x},${y}`;
      });
      const d = pts.map((p, i) => `${i ? "L" : "M"}${p}`).join(" ");
      const last = series[series.length - 1];
      const first = series.find(v => v != null);
      const delta = last != null && first != null ? last - first : null;
      const deltaLabel = delta == null ? "-" : `${delta > 0 ? "+" : ""}${delta}`;
      return `<div class="spark-row">
        <div class="name">${esc(name)}</div>
        <svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path class="series" d="${d}" stroke-width="2"></path></svg>
        <div class="hbar-score">${esc(deltaLabel)}</div>
      </div>`;
    }).join("") || "<p class='chart-empty'>No sparkline data.</p>";
  }

  function renderFindingsStatus() {
    const el = document.getElementById("chart-findings-status");
    if (!el) return;
    const all = current.findings || [];
    const counts = { new: 0, persisting: 0, resolved: 0, regressed: 0 };
    all.forEach(f => {
      const st = f.status || "new";
      if (counts[st] != null) counts[st] += 1;
    });
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    if (!total) {
      el.innerHTML = "<p class='chart-empty'>No findings in this version.</p>";
      return;
    }
    const order = ["new", "persisting", "regressed", "resolved"];
    const colors = {
      new: "var(--accent-text)",
      persisting: "var(--sev-major)",
      regressed: "var(--sev-critical)",
      resolved: "var(--muted)"
    };
    el.innerHTML = order.map(k => {
      const n = counts[k];
      const pct = Math.round((n / total) * 100);
      return `<div class="hbar-row">
        <div class="name">${k}</div>
        <div class="hbar-track"><div class="hbar-fill" data-width="${pct}" style="background:${colors[k]}"></div></div>
        <div class="hbar-score">${n}</div>
      </div>`;
    }).join("");
  }

  function renderMetricsChart() {
    const el = document.getElementById("chart-metrics");
    if (!el) return;
    const rows = (current.metric_deltas || []).filter(m => m.status === "compared" && m.delta_abs != null);
    if (!rows.length) {
      el.innerHTML = "<h3>Metric deltas</h3><p class='chart-empty'>No comparable metric deltas yet.</p>";
      return;
    }
    const maxAbs = Math.max(...rows.map(m => Math.abs(m.delta_abs)), 1);
    el.innerHTML = `<h3>Metric deltas</h3>` + rows.map(m => {
      const pct = Math.round((Math.abs(m.delta_abs) / maxAbs) * 100);
      const sign = m.delta_abs > 0 ? "+" : "";
      const color = m.delta_abs >= 0 ? "var(--accent-text)" : "var(--sev-critical)";
      return `<div class="hbar-row">
        <div class="name">${esc(m.name)}</div>
        <div class="hbar-track"><div class="hbar-fill" data-width="${pct}" style="background:${color}"></div></div>
        <div class="hbar-score">${sign}${esc(m.delta_abs)}</div>
      </div>`;
    }).join("");
  }

  function animateChartsIn() {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    requestAnimationFrame(() => {
      document.querySelectorAll(".hbar-fill[data-width]").forEach((bar, i) => {
        const w = bar.getAttribute("data-width") || "0";
        if (reduce) {
          bar.style.width = w + "%";
          return;
        }
        bar.style.width = "0%";
        setTimeout(() => { bar.style.width = w + "%"; }, 40 + i * 35);
      });
      document.querySelectorAll(".donut-arc").forEach((arc, i) => {
        const len = arc.getAttribute("data-len") || "0";
        const gap = arc.getAttribute("data-gap") || "0";
        if (reduce) {
          arc.setAttribute("stroke-dasharray", `${len} ${gap}`);
          return;
        }
        arc.setAttribute("stroke-dasharray", `0 ${Number(len) + Number(gap)}`);
        setTimeout(() => {
          arc.setAttribute("stroke-dasharray", `${len} ${gap}`);
        }, 60 + i * 80);
      });
      document.querySelectorAll(".chart-svg .series, .chart-svg .series-area, .chart-svg .dot").forEach((node, i) => {
        if (reduce) {
          node.classList.add("is-drawn");
          return;
        }
        setTimeout(() => node.classList.add("is-drawn"), 80 + i * 40);
      });
    });
  }

  function renderCharts() {
    renderCategoryBars("chart-category-bars");
    renderFindingsDonut("chart-findings-donut");
    renderOverallLine();
    renderCategorySparks();
    renderFindingsStatus();
    renderMetricsChart();
    animateChartsIn();
  }

  function initExportPdf() {
    const btn = document.getElementById("btn-export-pdf");
    if (!btn) return;
    btn.addEventListener("click", () => {
      window.print();
    });
  }

  function renderProgress() {
    const bars = document.getElementById("progress-bars");
    const hist = history.slice().sort((a, b) => a.version - b.version);
    bars.innerHTML = hist.map(h => {
      const o = h.overall == null ? 0 : h.overall;
      const hgt = Math.max(6, Math.round(o * 0.7));
      const fill = overallFill(h.overall);
      const label = h.overall == null ? "-" : String(h.overall);
      return `<div class="col"><div class="bar" style="height:${hgt}px;background:${fill};opacity:${h.overall == null ? .3 : 1}" title="${esc(label)}"></div><div class="lbl">v${esc(h.version)} · ${esc(label)}</div></div>`;
    }).join("") || "<p class='submeta'>One version so far.</p>";

    const sw = document.getElementById("version-switcher");
    sw.innerHTML = versions.map(v =>
      `<button type="button" class="chip ${v.version === current.version ? "" : "muted"}" data-v="${v.version}">v${v.version}</button>`
    ).join("");
    sw.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        current = versions.find(x => x.version === Number(btn.getAttribute("data-v"))) || current;
        renderAll();
      });
    });

    const rows = current.metric_deltas || [];
    document.getElementById("metrics-body").innerHTML = rows.length
      ? rows.map(m => {
          const d = m.delta_abs == null ? "-" : (m.delta_abs > 0 ? "+" : "") + m.delta_abs;
          return `<tr><td>${esc(m.name)}</td><td>${esc(m.value)}</td><td>${esc(m.previous_value == null ? "-" : m.previous_value)}</td><td>${esc(d)}</td><td>${esc(m.status)}</td></tr>`;
        }).join("")
      : `<tr><td colspan="5">No metrics recorded.</td></tr>`;

    renderCharts();
  }

  function renderFooter() {
    const c = current.coverage || {};
    const assumptions = (current.assumptions || []).map(a => `<li>${esc(a)}</li>`).join("") || "<li>None stated.</li>";
    document.getElementById("footer").innerHTML = `
      <div><strong style="color:var(--ink)">Coverage</strong> -
        files ${esc(c.files_reviewed)}/${esc(c.files_total)},
        screenshots ${esc(c.screenshots)},
        exports ${esc(c.exports)},
        web access ${c.web_access ? "yes" : "no"}
        ${c.notes ? ` · ${esc(c.notes)}` : ""}
      </div>
      <div style="margin-top:8px"><strong style="color:var(--ink)">Assumptions</strong>
        <ul class="assumptions">${assumptions}</ul>
      </div>
      <div style="margin-top:8px">Rubric ${esc(current.rubric_version)} · MasterG offline report · same layout for every product</div>`;
  }

  function renderAll() {
    renderHeader();
    renderCategories();
    renderFixFirst();
    renderStrengths();
    renderFindings();
    renderProgress();
    renderFooter();
  }

  [
    ["tab-summary", "panel-summary"],
    ["tab-findings", "panel-findings"],
    ["tab-progress", "panel-progress"],
  ].forEach(([tid, pid]) => {
    document.getElementById(tid).addEventListener("click", () => {
      ["tab-summary", "tab-findings", "tab-progress"].forEach(t => {
        document.getElementById(t).setAttribute("aria-selected", t === tid ? "true" : "false");
      });
      ["panel-summary", "panel-findings", "panel-progress"].forEach(p => {
        document.getElementById(p).hidden = p !== pid;
      });
      if (pid === "panel-summary" || pid === "panel-progress") {
        // Re-run grow animation when charts become visible
        document.querySelectorAll(".hbar-fill[data-width]").forEach(bar => { bar.style.width = "0%"; });
        document.querySelectorAll(".chart-svg .series, .chart-svg .series-area, .chart-svg .dot").forEach(n => {
          n.classList.remove("is-drawn");
        });
        document.querySelectorAll(".donut-arc").forEach(arc => {
          const len = Number(arc.getAttribute("data-len") || 0);
          const gap = Number(arc.getAttribute("data-gap") || 0);
          arc.setAttribute("stroke-dasharray", `0 ${len + gap}`);
        });
        animateChartsIn();
      }
    });
  });
  initDropdowns();
  initExportPdf();

  if (!current) {
    document.getElementById("product-name").textContent = "No data";
    document.getElementById("verdict-line").textContent = "Run masterg.py finalize to generate a report.";
    return;
  }
  renderAll();
})();
</script>
</body>
</html>
